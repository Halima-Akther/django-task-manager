{% extends "base.html" %}
{% block title %}Task Detail{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow">
            <div class="card-header bg-info text-white text-center">
                <h3>{{ task.title }}</h3>
            </div>

            <div class="card-body">
                <p class="fs-5">{{ task.description }}</p>

                <div class="d-flex justify-content-between">
                    <span class="badge bg-primary">{{ task.get_category_display }}</span>

                    {% if task.is_completed %}
                    <span class="badge bg-success">Completed</span>
                    {% else %}
                    <span class="badge bg-warning text-dark">Pending</span>
                    {% endif %}
                </div>

                <div class="mt-4 d-flex gap-2 justify-content-center">
                    <a href="{% url 'task_update' task.pk %}" class="btn btn-primary">Edit</a>
                    <a href="{% url 'task_delete' task.pk %}" class="btn btn-danger">Delete</a>
                    <a href="{% url 'task_list' %}" class="btn btn-secondary">Back</a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
